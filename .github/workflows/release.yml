name: release

# Publishes immutable packet/module tags from the authoritative org repository.
# with the printable booklet and reference-sheet PDFs attached.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  release:
    if: github.repository == 'DSA-Woodshed/dsa-study-packet'
    name: build + publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # Pinned by commit with the release tag as a comment, matching ci.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.27" # matches UV_VERSION in .devcontainer/setup.sh
          prune-cache: "true" # preserve the pre-v9 cache-size behavior

      - name: Install just
        uses: taiki-e/install-action@v2.87.25
        with:
          tool: just@1.40.0

      - name: Install dependencies
        run: just deps-sync

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Build printable booklet
        run: just packet

      - name: Build reference-sheet PDFs
        run: just pdf-all

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" booklet.pdf reference-sheets/pdf/*.pdf --generate-notes
